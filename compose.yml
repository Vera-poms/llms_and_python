services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llms
      POSTGRES_PASSWORD: llms_dev_password
      POSTGRES_DB: llms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llms -d llms"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"

  backend:
    build:
      context: ./apps/backend/app
    environment:
      DATABASE_URL: postgresql+psycopg://llms:llms_dev_password@db:5432/llms
      SECRET_KEY: dev-secret-change-me
      CORS_ORIGINS: http://localhost:5000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8020:8020"
    volumes:
      - ./apps/backend/app:/app
      - ./course:/course

  frontend:
    build:
      context: ./apps/frontend/app
    environment:
      # Reaches the browser, not other containers — must be the host-published backend port.
      VITE_API_URL: http://localhost:8020
    depends_on:
      - backend
    ports:
      - "5000:5000"
    volumes:
      - ./apps/frontend/app:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:
