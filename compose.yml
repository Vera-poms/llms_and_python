services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-llms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"

  backend:
    build:
      context: ./apps/backend/app
    env_file:
      - ./apps/backend/app/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-llms}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-llms}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8020:8020"
    volumes:
      - ./apps/backend/app:/app
      - ./course:/course

  frontend:
    build:
      context: ./apps/frontend/app
    environment:
      # Reaches the browser, not other containers — must be the host-published backend port.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8020}
    depends_on:
      - backend
    ports:
      - "5000:5000"
    volumes:
      - ./apps/frontend/app:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:
